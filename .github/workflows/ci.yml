name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic repository guardrails
        run: node --test tests/ci-container-readiness.test.mjs

  validate:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Persisted locator adapter tests
        run: python3 -m unittest tests/test_platform_persisted_locator_adapter.py

      - name: Recovery controller store tests
        run: python3 -m unittest tests/test_platform_recovery_controller_store.py

      - name: PostgreSQL 17 disposable runtime posture tests
        # The runner owns the exact codex-platform127-pg17 postgres:17 fixture and listener.
        # Its disposable container uses POSTGRES_HOST_AUTH_METHOD=trust only locally.
        run: npm run test:disposable-runtime-postgres

      - name: PostgreSQL 17 disposable role-collapse migration and concurrency proofs
        run: npm run test:disposable-role-collapse-postgres

      - name: PostgreSQL 17 disposable migrator alignment proofs
        run: npm run test:disposable-migrator-alignment

      - name: PostgreSQL 17 disposable durable database operations proofs
        run: npm run test:disposable-durable-db-operations

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image without pushing
        run: docker build --pull --tag swooshz-platform:ci .

  recovery-managed-deterministic:
    name: Managed recovery deterministic qualification
    runs-on: ubuntu-latest
    needs: guardrails
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Prove exact checked head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run deterministic managed-boundary qualification
        run: python3 recovery/managed/qualify.py --deterministic

      - name: Run native C11 build and static closure
        run: python3 recovery/managed/build.py --verify

  recovery-managed-hosted-security:
    name: Managed recovery isolated hosted security qualification
    runs-on: ubuntu-latest
    needs: recovery-managed-deterministic
    if: github.event_name == 'pull_request'

    steps:
      - name: Check out exact candidate head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install disposable qualification tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            cryptsetup \
            openssh-client \
            openssh-server \
            policycoreutils \
            qemu-system-x86 \
            selinux-utils \
            util-linux

      - name: Prove exact checked head
        shell: bash
        run: test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Run mandatory isolated kernel/OpenSSH/SELinux/dm-verity proof
        run: python3 recovery/managed/qualification-vm.py --required
