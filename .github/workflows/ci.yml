name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic repository guardrails
        run: node --test tests/ci-container-readiness.test.mjs

  validate:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: PostgreSQL 17 disposable runtime posture tests
        # The runner owns the exact codex-platform127-pg17 postgres:17 fixture and listener.
        # Its disposable container uses POSTGRES_HOST_AUTH_METHOD=trust only locally.
        run: npm run test:disposable-runtime-postgres

      - name: PostgreSQL 17 disposable role-collapse migration and concurrency proofs
        run: npm run test:disposable-role-collapse-postgres

      - name: PostgreSQL 17 disposable migrator alignment proofs
        run: npm run test:disposable-migrator-alignment

      - name: PostgreSQL 17 disposable durable database operations proofs
        run: npm run test:disposable-durable-db-operations

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image without pushing
        run: docker build --pull --tag swooshz-platform:ci .
