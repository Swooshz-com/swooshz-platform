name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  guardrails:
    name: Repository guardrails
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run deterministic repository guardrails
        run: node --test tests/ci-container-readiness.test.mjs

  validate:
    name: Typecheck, build, and test
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Persisted locator adapter tests
        run: python3 -m unittest tests/test_platform_persisted_locator_adapter.py

      - name: Recovery controller store tests
        run: python3 -m unittest tests/test_platform_recovery_controller_store.py

      - name: PostgreSQL 17 disposable runtime posture tests
        # The runner owns the exact codex-platform127-pg17 postgres:17 fixture and listener.
        # Its disposable container uses POSTGRES_HOST_AUTH_METHOD=trust only locally.
        run: npm run test:disposable-runtime-postgres

      - name: PostgreSQL 17 disposable role-collapse migration and concurrency proofs
        run: npm run test:disposable-role-collapse-postgres

      - name: PostgreSQL 17 disposable migrator alignment proofs
        run: npm run test:disposable-migrator-alignment

      - name: PostgreSQL 17 disposable durable database operations proofs
        run: npm run test:disposable-durable-db-operations

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: guardrails

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build runtime image without pushing
        run: docker build --pull --tag swooshz-platform:ci .

  recovery-managed-g3:
    name: Managed recovery G3 qualification
    runs-on: ubuntu-latest
    needs: [guardrails, validate, container]
    timeout-minutes: 60
    env:
      CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

    steps:
      - name: Check out exact candidate commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: Assert exact candidate head
        run: test "$(git rev-parse HEAD)" = "$CANDIDATE_SHA"

      - name: Run managed-boundary pre-guest qualification
        run: |
          mkdir -p _output/recovery-managed-build
          SWZ_CANDIDATE_SHA="$CANDIDATE_SHA" python3 -B recovery/managed/qualify.py \
            --phase preflight \
            --expected-sha "$CANDIDATE_SHA" \
            --output _output/recovery-managed-preflight-evidence.json \
            --build-output _output/recovery-managed-build

      - name: Prepare disposable guest security toolchain
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install --yes --no-install-recommends \
            cpio cryptsetup e2fsprogs iproute2 netcat-openbsd policycoreutils \
            selinux-policy-default selinux-utils qemu-system-x86
          guest_root="$RUNNER_TEMP/swz-guest-root"
          mkdir -p "$guest_root"
          sudo cp -a /bin /sbin /lib /lib64 /usr /etc "$guest_root/"
          sudo rm -f "$guest_root/etc/mtab" "$guest_root/etc/resolv.conf"
          sudo install -d -m 0755 "$guest_root/var/lib" "$guest_root/var/empty"
          sudo cp -a /var/lib/selinux "$guest_root/var/lib/"
          sudo chown -R "$USER":"$USER" "$guest_root"
          printf 'SWZ_GUEST_ROOT=%s\n' "$guest_root" >> "$GITHUB_ENV"

      - name: Run complete managed-boundary qualification
        run: |
          SWZ_CANDIDATE_SHA="$CANDIDATE_SHA" python3 -B recovery/managed/qualify.py \
            --phase guest \
            --expected-sha "$CANDIDATE_SHA" \
            --output _output/recovery-managed-qualification-evidence.json \
            --resume _output/recovery-managed-preflight-evidence.json \
            --build-output _output/recovery-managed-build

      - name: Upload managed-boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: recovery-managed-g3-evidence-${{ env.CANDIDATE_SHA }}
          path: _output
          if-no-files-found: warn
